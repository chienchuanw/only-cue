name: Nightly UI smoke

# Runs the OnlyCueUITests target on a recurring schedule. The hosted
# macOS-15 runner image (since 20260520.0085 / macOS 15.7.7) cannot
# reliably foreground the test app, so PR CI gates on lint+unit only
# (see issue #371). This workflow attempts the UI suite once per day so
# that UI regressions still surface — even though some runs will go red
# from the runner-side foreground race, repeated failures highlight real
# regressions versus single-run flakes.

on:
  schedule:
    # 09:00 UTC daily — well after Apple/GitHub typical image roll times.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ui
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests (macOS, nightly)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      # Keep the runner display awake so XCUITest's foreground promotion
      # has a chance to land. macOS 15.7.7+ on hosted runners is still
      # flaky here — see issue #371 — but the longer the display stays
      # awake, the better the odds.
      - name: Keep display awake
        run: |
          caffeinate -dimsu -t 2700 &

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
