name: CI

# Runs on the project's self-hosted macOS runner (see issue #371 for the
# investigation trail). The previously-used `macos-latest` hosted runner is
# avoided because (a) macOS 15.7.7 regressed XCUITest application
# foregrounding ("Failed to activate application … Running Background"),
# and (b) the GitHub Free plan's 200 effective macOS-minute monthly budget
# (2,000 minutes × 1/10 multiplier) is too small for a UI-test-heavy
# native app — a single full PR run cost ~330 billable minutes.
#
# The self-hosted runner runs on a dedicated, always-logged-in Mac mini,
# so XCUITest foreground promotion works and there is no per-minute cost.
# The runner must be online (Mac mini powered on / awake) for jobs to start.

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  # Manual trigger for the screenshot / Figma-baseline UI tests (#548). These
  # are doc/baseline generators, not regression gates, so they are kept off the
  # automatic PR/push path and run on demand when refreshing baselines.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS, self-hosted)
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tooling is normally already present on the maintainer's Mac. Guard
      # the `brew install` so the step is a no-op when the binaries exist;
      # only the first run (or after a fresh `brew uninstall`) pays the
      # install cost.
      - name: Ensure tooling
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -configuration Debug \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions

      # The self-hosted runner occasionally wedges its test daemon
      # (`testmanagerd` / the UI-Automation control session) after an
      # interrupted run, so the next `xcodebuild test` times out with
      # "Timed out … initiating control session with daemon" → TEST EXECUTE
      # FAILED (#471). Clear any stray app / runner processes first, and
      # best-effort reset the daemon. `sudo -n` is a no-op when the runner
      # user lacks passwordless sudo for `killall` — the user-process kills
      # still help; granting `NOPASSWD: /usr/bin/killall testmanagerd` lets
      # the daemon reset fire too.
      - name: Reset stale test state
        run: |
          pkill -9 -x OnlyCue 2>/dev/null || true
          pkill -9 -f 'OnlyCue.app/Contents/MacOS/OnlyCue' 2>/dev/null || true
          pkill -9 -f XCTRunner 2>/dev/null || true
          pkill -9 -f AutomationModeUI 2>/dev/null || true
          sudo -n killall testmanagerd 2>/dev/null || true

      # One-shot whole-step retry: the daemon-init timeout fails the entire
      # run (not an individual test), so `-retry-tests-on-failure` (a
      # per-test retry) can't catch it. On the first failure, reset the
      # daemon and re-run once; a genuine test failure still fails twice.
      - name: Unit tests
        run: |
          set -o pipefail
          run_unit_tests() {
            xcodebuild test-without-building \
              -project OnlyCue.xcodeproj \
              -scheme OnlyCue \
              -destination 'platform=macOS' \
              -only-testing:OnlyCueTests \
              -parallel-testing-enabled NO \
              | xcbeautify --renderer github-actions
          }
          run_unit_tests || {
            echo "::warning::Unit tests failed once — resetting the test daemon and retrying once (absorbs the testmanagerd control-session flake; see #471)."
            pkill -9 -f XCTRunner 2>/dev/null || true
            pkill -9 -f AutomationModeUI 2>/dev/null || true
            sudo -n killall testmanagerd 2>/dev/null || true
            sleep 5
            run_unit_tests
          }

      # UI tests run on the Mac mini's real logged-in macOS session, so
      # the XCUITest foreground promotion works (unlike on the hosted
      # `macos-latest` runner, where every test failed activation).
      # `-test-iterations 2 -retry-tests-on-failure` absorbs the known
      # XCUITest "Failed to activate application" flake without hiding real
      # regressions (a test that fails twice in a row still fails the job).
      # Was present on the macos-latest workflow; dropped during the
      # self-hosted migration (3a002cb) but the same flake still happens on
      # the self-hosted runner, so it needs to come back.
      # Marker file consumed by `CIRuntime.isSelfHostedRunner` inside the
      # test target. Environment variables don't propagate through the
      # macOS XCUITest sandbox, so the workflow writes a known path the
      # test process can read via FileManager. Removed on `always()`
      # after the UI-tests step to avoid leaking the marker into local
      # test runs on the same machine.
      - name: Mark CI active
        run: touch "/tmp/.onlycue-ci-active"

      # UI tests run on push to dev/main only, NOT on PR. Historically the
      # self-hosted runner ran on the maintainer's primary workstation, where
      # an unattended desktop (overnight, screen locked, fast-user-switched)
      # left the macOS window-server unable to foreground a freshly-launched
      # app from the XCTRunner process — every UI test then failed with
      # "Failed to activate application (current state: Running Background)"
      # regardless of retry budget or timeout cap (see PR #387 for the
      # 7-attempt rabbit hole that established this). The runner now lives on
      # a dedicated, always-logged-in Mac mini, which should remove that
      # constraint; re-enabling UI tests on PRs is a separate decision, gated
      # on confirming the dedicated session stays foregroundable. Until then
      # the push-only gate stays. Per-test XCTSkipIf guards still apply when
      # UI tests do run; they just no longer sit behind a 90-min flake budget
      # on every PR.
      # Behavioral UI tests only (#548): the screenshot / Figma-baseline classes
      # are excluded here and run via the manual "UI baseline screenshots" step
      # below. This keeps the push path to the UI tests that actually gate
      # behavior (menus, mode/inspector swaps, layout geometry, hit-testing).
      - name: UI tests (behavioral)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests \
            -skip-testing:OnlyCueUITests/AudioSettingsScreenshotTests \
            -skip-testing:OnlyCueUITests/DocumentViewModeScreenshotTests \
            -skip-testing:OnlyCueUITests/ExportSheetScreenshotTests \
            -skip-testing:OnlyCueUITests/KeyboardSettingsScreenshotTests \
            -skip-testing:OnlyCueUITests/LyricsLaneEditingUITests \
            -skip-testing:OnlyCueUITests/OSCMonitorScreenshotTests \
            -skip-testing:OnlyCueUITests/OSCSettingsScreenshotTests \
            -skip-testing:OnlyCueUITests/Phase3ScreenshotTests \
            -skip-testing:OnlyCueUITests/ShowModeUITests \
            -skip-testing:OnlyCueUITests/TempoGridOverlayScreenshotTests \
            -skip-testing:OnlyCueUITests/TimecodeSettingsSheetScreenshotTests \
            -skip-testing:OnlyCueUITests/TransportBarScreenshotTests \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            | xcbeautify --renderer github-actions

      # Screenshot / Figma-baseline generators — manual only (#548).
      - name: UI baseline screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests/AudioSettingsScreenshotTests \
            -only-testing:OnlyCueUITests/DocumentViewModeScreenshotTests \
            -only-testing:OnlyCueUITests/ExportSheetScreenshotTests \
            -only-testing:OnlyCueUITests/KeyboardSettingsScreenshotTests \
            -only-testing:OnlyCueUITests/LyricsLaneEditingUITests \
            -only-testing:OnlyCueUITests/OSCMonitorScreenshotTests \
            -only-testing:OnlyCueUITests/OSCSettingsScreenshotTests \
            -only-testing:OnlyCueUITests/Phase3ScreenshotTests \
            -only-testing:OnlyCueUITests/ShowModeUITests \
            -only-testing:OnlyCueUITests/TempoGridOverlayScreenshotTests \
            -only-testing:OnlyCueUITests/TimecodeSettingsSheetScreenshotTests \
            -only-testing:OnlyCueUITests/TransportBarScreenshotTests \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            | xcbeautify --renderer github-actions

      - name: Clear CI marker
        if: always()
        run: rm -f "/tmp/.onlycue-ci-active"
