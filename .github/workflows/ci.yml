name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen swiftlint xcbeautify

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  unit-tests:
    name: Unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueTests \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  ui-tests:
    name: UI tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      # UI tests on the GitHub Actions macOS runner intermittently hit
      # "Failed to activate application … (current state: Running Background)"
      # when test bundles launch the app concurrently — the runner's window
      # server can only foreground one process. Disabling parallel testing
      # plus a single retry on failure (`-test-iterations 2
      # -retry-tests-on-failure`) absorbs that race without changing the
      # tests themselves.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
