name: CI

# Runs on the project's self-hosted macOS runner (see issue #371 for the
# investigation trail). The previously-used `macos-latest` hosted runner is
# avoided because (a) macOS 15.7.7 regressed XCUITest application
# foregrounding ("Failed to activate application … Running Background"),
# and (b) the GitHub Free plan's 200 effective macOS-minute monthly budget
# (2,000 minutes × 1/10 multiplier) is too small for a UI-test-heavy
# native app — a single full PR run cost ~330 billable minutes.
#
# The self-hosted runner runs on a dedicated, always-logged-in Mac mini,
# so XCUITest foreground promotion works and there is no per-minute cost.
# The runner must be online (Mac mini powered on / awake) for jobs to start.

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  # Manual trigger for the screenshot / Figma-baseline UI tests (#548). These
  # are doc/baseline generators, not regression gates, so they are kept off the
  # automatic PR/push path and run on demand when refreshing baselines.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS, self-hosted)
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tooling is normally already present on the maintainer's Mac. Guard
      # the `brew install` so the step is a no-op when the binaries exist;
      # only the first run (or after a fresh `brew uninstall`) pays the
      # install cost.
      - name: Ensure tooling
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      # The UI-test watchdog is the thing standing between a wedge and a wasted
      # 90-minute job, so it gets its own tests and they gate every run (~15s).
      - name: CI script tests
        run: scripts/ci/run-with-watchdog.test.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -configuration Debug \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions

      # The self-hosted runner occasionally wedges its test daemon
      # (`testmanagerd` / the UI-Automation control session) after an
      # interrupted run, so the next `xcodebuild test` times out with
      # "Timed out … initiating control session with daemon" → TEST EXECUTE
      # FAILED (#471, #595). `testmanagerd` runs as the *runner user*, so a
      # plain `killall` (no sudo) kills it and a fresh one respawns clean — the
      # previous `sudo -n killall testmanagerd` was a silent no-op without
      # passwordless sudo, so the reset never actually fired. `automationmode-
      # writer` ownership is uncertain, so try both a no-sudo `killall` and a
      # best-effort `sudo -n` (#605).
      - name: Reset stale test state
        run: |
          pkill -9 -x OnlyCue 2>/dev/null || true
          pkill -9 -f 'OnlyCue.app/Contents/MacOS/OnlyCue' 2>/dev/null || true
          pkill -9 -f XCTRunner 2>/dev/null || true
          pkill -9 -f AutomationModeUI 2>/dev/null || true
          killall -9 testmanagerd 2>/dev/null || true
          killall -9 automationmode-writer 2>/dev/null || true
          sudo -n killall -9 automationmode-writer 2>/dev/null || true
          sleep 3

      # One-shot whole-step retry: the daemon-init timeout fails the entire
      # run (not an individual test), so `-retry-tests-on-failure` (a
      # per-test retry) can't catch it. On the first failure, reset the
      # daemon and re-run once; a genuine test failure still fails twice.
      - name: Unit tests
        run: |
          set -o pipefail
          run_unit_tests() {
            xcodebuild test-without-building \
              -project OnlyCue.xcodeproj \
              -scheme OnlyCue \
              -destination 'platform=macOS' \
              -only-testing:OnlyCueTests \
              -parallel-testing-enabled NO \
              | xcbeautify --renderer github-actions
          }
          run_unit_tests || {
            echo "::warning::Unit tests failed once — resetting the test daemon and retrying once (absorbs the testmanagerd control-session flake; see #471, #595)."
            pkill -9 -f XCTRunner 2>/dev/null || true
            pkill -9 -f AutomationModeUI 2>/dev/null || true
            killall -9 testmanagerd 2>/dev/null || true
            killall -9 automationmode-writer 2>/dev/null || true
            sudo -n killall -9 automationmode-writer 2>/dev/null || true
            sleep 5
            run_unit_tests
          }

      # UI tests run on the Mac mini's real logged-in macOS session, so
      # the XCUITest foreground promotion works (unlike on the hosted
      # `macos-latest` runner, where every test failed activation).
      # `-test-iterations 2 -retry-tests-on-failure` absorbs the known
      # XCUITest "Failed to activate application" flake without hiding real
      # regressions (a test that fails twice in a row still fails the job).
      # Was present on the macos-latest workflow; dropped during the
      # self-hosted migration (3a002cb) but the same flake still happens on
      # the self-hosted runner, so it needs to come back.
      # Marker file consumed by `CIRuntime.isSelfHostedRunner` inside the
      # test target. Environment variables don't propagate through the
      # macOS XCUITest sandbox, so the workflow writes a known path the
      # test process can read via FileManager. Removed on `always()`
      # after the UI-tests step to avoid leaking the marker into local
      # test runs on the same machine.
      - name: Mark CI active
        run: touch "/tmp/.onlycue-ci-active"

      # UI tests run on push to dev only — not on PR, and not on main.
      #
      # Skipping main is #776. A release fast-forwards dev into main, so the
      # same commit is pushed twice. `concurrency.group` keys on the ref, so the
      # two runs land in different groups and do not cancel each other; with one
      # runner they serialize. On 03f5576 the pair occupied the runner from
      # 15:22Z to 17:24Z (~2h01m wall) and a PR queued behind both. Most of that
      # was the #775 wedge, not the duplication — the duplicate itself cost
      # ~30 min there, and 7m04s on the healthy 0.28.0 release (run
      # 32882261391). 7 to 29 minutes of re-running a by-construction-identical
      # tree is the actual saving.
      #
      # Written as an allowlist rather than `!= refs/heads/main`: the two are
      # equivalent only because `on.push.branches` happens to be exactly
      # [main, dev]. Adding a release/* or hotfix/* branch to that trigger would
      # silently re-enable the full suite on it. This states the intent instead.
      #
      # Two things this gives up, both accepted deliberately:
      #
      # 1. A release commit no longer earns its own green UI run — it inherits
      #    dev's. That is a convention, not a guarantee. `cancel-in-progress`
      #    kills a dev run when the next dev push lands, so a bump FF'd while a
      #    later merge supersedes its dev run leaves the released commit with no
      #    green UI run anywhere, and nothing surfaces that. Observed once in the
      #    last 8 releases (31319081463, superseded after 4m36s). The other 6
      #    non-green dev runs in that window were all the #775 90-minute wedge,
      #    now fixed, so the forward-looking base rate should be much better than
      #    the history suggests. `docs/release.md` step 2 ("make sure dev is
      #    green") is the only enforcement.
      # 2. main is no longer a meaningful build gate. It keeps lint + build +
      #    unit, but that is ~18s total on a fast-forward and the Build step is a
      #    2-second DerivedData cache hit — it verifies the cache is warm, not
      #    that the tree compiles. It is kept because it is nearly free, not
      #    because it proves anything. The shipped artifact is gated by
      #    scripts/build-release.sh (Release config, warnings-as-errors) run
      #    locally per docs/release.md; CI only ever builds Debug.
      #
      # If main starts receiving commits that are not already on dev — CLAUDE.md
      # permits direct pushes for repo-metadata work — those commits get no UI
      # coverage and nothing detects it. Revisit this condition if that changes.
      #
      # Skipping PRs is older. Historically the self-hosted runner ran on the
      # maintainer's primary workstation, where an unattended desktop (overnight,
      # screen locked, fast-user-switched) left the macOS window-server unable to
      # foreground a freshly-launched app from the XCTRunner process — every UI
      # test then failed with "Failed to activate application (current state:
      # Running Background)" regardless of retry budget or timeout cap (see PR
      # #387 for the 7-attempt rabbit hole that established this). The runner
      # now lives on a dedicated Mac mini, but that did not remove the
      # constraint: #775 reproduced the identical failure there — 39 activation
      # failures across 21 tests, every one of them at the app-launch helper —
      # purely because the mini's screen was locked. The same commit re-ran
      # green in 7m07s once it was unlocked (run 32938412653). The real
      # precondition is an unlocked, on-console session, and nothing in CI
      # enforces or reports it. Re-enabling UI tests on PRs stays a separate
      # decision, gated on that. Until then the push-only gate stays. Per-test
      # XCTSkipIf guards still apply when UI tests do run; they just no longer
      # sit behind a 90-min flake budget on every PR.
      #
      # Behavioral UI tests only (#548): the screenshot / Figma-baseline classes
      # are excluded here and run via the manual "UI baseline screenshots" step
      # below. This keeps the push path to the UI tests that actually gate
      # behavior (menus, mode/inspector swaps, layout geometry, hit-testing).
      - name: UI tests (behavioral)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          # Raw, un-xcbeautified xcodebuild output, one file per attempt.
          # Uploaded on failure so a wedge can be diagnosed from the run page
          # instead of by SSHing to the Mac mini (#775). Set per step, not on
          # the job: the `runner` context is not available in a job-level `env`.
          UI_TEST_LOG_DIR: ${{ runner.temp }}/ui-test-logs
        run: |
          set -o pipefail
          # NOTE: a caffeinate wrapper and -test-timeouts-enabled were tried in
          # #603 but reverted (#605) — both correlated with the UI runner
          # failing to enable automation mode at init, deterministically, on
          # every push. The pre-#603 invocation below is the known-good one.

          # Drop stale XCUITest daemons. The UI runner's init can time out with
          # "The test runner failed to initialize for UI testing … Timed out
          # while enabling automation mode." — a runner-INIT flake that fails
          # the whole job before any test runs, so -retry-tests-on-failure (a
          # per-test retry) can't catch it (#605). testmanagerd is runner-user
          # owned (plain killall works, #595); automationmode-writer ownership
          # is uncertain, so try both no-sudo and best-effort sudo.
          reset_ui_daemons() {
            pkill -9 -x OnlyCue 2>/dev/null || true
            pkill -9 -f 'OnlyCue.app/Contents/MacOS/OnlyCue' 2>/dev/null || true
            pkill -9 -f XCTRunner 2>/dev/null || true
            pkill -9 -f AutomationModeUI 2>/dev/null || true
            killall -9 testmanagerd 2>/dev/null || true
            killall -9 automationmode-writer 2>/dev/null || true
            sudo -n killall -9 automationmode-writer 2>/dev/null || true
            sleep 5
          }

          # The wedge (#775): xcodebuild stays alive with its stdout dead and
          # never exits, so the retry below — which only fires on a non-zero
          # *exit* — was unreachable and the job burned all 90 minutes. The
          # watchdog kills a stalled run and exits 124, making that retry
          # reachable for the first time. Rationale for how it kills without
          # disturbing xcodebuild lives in the script's own header.
          #
          # 600s stall / 2400s cap: the healthy step measured 7m04s (run
          # 32882261391) to 28m44s (run 32879198538) on the same commit — the
          # spread is `-test-iterations 2` retries. A healthy run emits test
          # events at ~2/min, so 10 minutes of silence cannot happen. Two capped
          # attempts plus the earlier steps come to ~82 min, inside the 90-min
          # job timeout.
          #
          # Each attempt gets its own raw log: the watchdog truncates its log on
          # start, so a shared path would let the retry erase the wedged
          # attempt's output — the one worth reading.
          run_ui_tests() {
            scripts/ci/run-with-watchdog.sh \
              --log "$UI_TEST_LOG_DIR/attempt-$1.log" \
              --stall-timeout 600 \
              --hard-timeout 2400 \
              -- \
            xcodebuild test-without-building \
              -project OnlyCue.xcodeproj \
              -scheme OnlyCue \
              -destination 'platform=macOS' \
              -only-testing:OnlyCueUITests \
              -skip-testing:OnlyCueUITests/AudioSettingsScreenshotTests \
              -skip-testing:OnlyCueUITests/DocumentViewModeScreenshotTests \
              -skip-testing:OnlyCueUITests/ExportSheetScreenshotTests \
              -skip-testing:OnlyCueUITests/KeyboardSettingsScreenshotTests \
              -skip-testing:OnlyCueUITests/LyricsLaneEditingUITests \
              -skip-testing:OnlyCueUITests/OSCMonitorScreenshotTests \
              -skip-testing:OnlyCueUITests/OSCSettingsScreenshotTests \
              -skip-testing:OnlyCueUITests/Phase3ScreenshotTests \
              -skip-testing:OnlyCueUITests/ShowModeUITests \
              -skip-testing:OnlyCueUITests/TempoGridOverlayScreenshotTests \
              -skip-testing:OnlyCueUITests/TimecodeSettingsSheetScreenshotTests \
              -skip-testing:OnlyCueUITests/TransportBarScreenshotTests \
              -parallel-testing-enabled NO \
              -test-iterations 2 \
              -retry-tests-on-failure \
              | xcbeautify --renderer github-actions
          }

          # Session-degradation signal (#775). Before the wedge, ~17 of ~38 test
          # attempts failed with "Lost connection to the application", so the
          # session was already sick. Reported only — we have no baseline for a
          # sane abort threshold yet, and a new abort path would be a second new
          # way for this step to fail. Tracked for a follow-up.
          report_connection_losses() {
            losses="$(grep -c 'Lost connection to the application' "$UI_TEST_LOG_DIR/attempt-$1.log" 2>/dev/null || true)"
            if [ -n "$losses" ] && [ "$losses" -gt 0 ]; then
              echo "::warning::attempt $1: ${losses} 'Lost connection to the application' event(s) — the XCUITest session may be degraded (#775)."
            fi
          }

          mkdir -p "$UI_TEST_LOG_DIR"

          # One-shot whole-step retry: absorbs the runner-init flake without
          # hiding regressions (a genuine failure still fails twice).
          #
          # Written as an explicit single-exit flow rather than
          # `run_ui_tests || { ...; run_ui_tests; }`: GitHub runs `run:` blocks
          # under `bash -e`, which aborts the block the moment the retry fails,
          # skipping any reporting that follows it inside the `||` branch.
          status=0
          run_ui_tests 1 || status=$?
          report_connection_losses 1

          if [ "$status" -ne 0 ]; then
            echo "::warning::UI tests failed once — resetting XCUITest daemons and retrying once (absorbs the automation-mode init flake; see #605, #595)."
            reset_ui_daemons
            status=0
            run_ui_tests 2 || status=$?
            report_connection_losses 2
          fi

          exit "$status"

      # Screenshot / Figma-baseline generators — manual only (#548).
      - name: UI baseline screenshots
        if: github.event_name == 'workflow_dispatch'
        env:
          UI_TEST_LOG_DIR: ${{ runner.temp }}/ui-test-logs
        run: |
          set -o pipefail
          # Same XCUITest app-launch path as the behavioral step above, so it is
          # exposed to the same #775 wedge — and a wedge here would monopolise
          # the single self-hosted runner for 90 minutes. No retry: a baseline
          # refresh is manual and re-dispatching is a click.
          mkdir -p "$UI_TEST_LOG_DIR"
          scripts/ci/run-with-watchdog.sh \
            --log "$UI_TEST_LOG_DIR/baseline.log" \
            --stall-timeout 600 \
            --hard-timeout 2400 \
            -- \
          xcodebuild test-without-building \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests/AudioSettingsScreenshotTests \
            -only-testing:OnlyCueUITests/DocumentViewModeScreenshotTests \
            -only-testing:OnlyCueUITests/ExportSheetScreenshotTests \
            -only-testing:OnlyCueUITests/KeyboardSettingsScreenshotTests \
            -only-testing:OnlyCueUITests/LyricsLaneEditingUITests \
            -only-testing:OnlyCueUITests/OSCMonitorScreenshotTests \
            -only-testing:OnlyCueUITests/OSCSettingsScreenshotTests \
            -only-testing:OnlyCueUITests/Phase3ScreenshotTests \
            -only-testing:OnlyCueUITests/ShowModeUITests \
            -only-testing:OnlyCueUITests/TempoGridOverlayScreenshotTests \
            -only-testing:OnlyCueUITests/TimecodeSettingsSheetScreenshotTests \
            -only-testing:OnlyCueUITests/TransportBarScreenshotTests \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            | xcbeautify --renderer github-actions

      # Only on failure: a green run's raw log is ~50 MB of noise nobody reads.
      # The event guard skips PR runs, which never reach a step that writes
      # these logs. `if-no-files-found: ignore` covers the other two cases where
      # the directory is absent: a main push (#776 skips the UI step there) and
      # a dev failure earlier than the UI step.
      - name: Upload raw UI-test logs
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-raw-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-test-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Clear CI marker
        if: always()
        run: rm -f "/tmp/.onlycue-ci-active"
