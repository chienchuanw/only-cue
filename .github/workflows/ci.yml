name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen swiftlint xcbeautify

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  unit-tests:
    name: Unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueTests \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # The GHA macos-15 runner image 20260520.0085 (macOS 15.7.7 / 24G720)
  # regressed XCUITest application foregrounding: every UI test fails with
  # "Failed to activate application (current state: Running Background)".
  # The runner has no logged-in GUI session, so the foreground promotion
  # that the test runner attempts after `[XCUIApplication launch]` is
  # ignored by the post-15.7.7 WindowServer.
  #
  # Pinning to macos-14 is not viable — that image only ships Xcode 16.2,
  # but OnlyCue requires Xcode 26 SDK (uses `Unmanaged<MTAudioProcessingTap>`
  # and other macOS-26 APIs).
  #
  # Workaround: keep the macos-latest runner, but before launching tests,
  # wake the display (`caffeinate`) and explicitly bring the test app
  # forward via AppleScript. This isn't bullet-proof — if it still flakes,
  # the screenshot-baseline tests should move to a nightly cron and PR CI
  # gates on lint+unit only. See issue #371.
  ui-tests:
    name: UI tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      # Keep the runner display awake for the whole test step so the
      # WindowServer remains willing to grant frontmost status to the
      # XCUITest-spawned OnlyCue process. Without this, macOS 15.7.7+ on
      # the hosted runner refuses to foreground the app and every UI test
      # times out with "Failed to activate application (current state:
      # Running Background)".
      - name: Keep display awake
        run: |
          caffeinate -dimsu -t 1800 &
          echo "CAFFEINATE_PID=$!" >> $GITHUB_ENV

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests \
            -parallel-testing-enabled NO \
            -test-iterations 2 \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
