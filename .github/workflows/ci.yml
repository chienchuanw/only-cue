name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen swiftlint xcbeautify

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  unit-tests:
    name: Unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueTests \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # UI tests run on push to dev/main, NOT on every PR. GHA macos-15 runner
  # image 20260520.0085 (macOS 15.7.7 / 24G720) regressed XCUITest's
  # ability to foreground the test app — every UI test fails with "Failed
  # to activate application (current state: Running Background)". Workarounds
  # investigated and ruled out (see issue #371): pinning to macos-14
  # (only ships Xcode 16.2, but OnlyCue needs Xcode 26 SDK) and
  # `caffeinate -dimsu` (does not address the WindowServer-side foreground
  # gate). Until GitHub fixes the macOS 15 image or macOS 16 lands without
  # the regression, PRs are gated on lint + unit only. The nightly
  # `ui-smoke.yml` workflow attempts UI tests on a fresh runner so we
  # detect any drift in this PR's user-visible behavior on a recurring
  # schedule even if not per-PR.
  ui-tests:
    name: UI tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: lint-and-build
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-${{ hashFiles('OnlyCue/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '.swiftlint.yml') }}-
            ${{ runner.os }}-xcode-

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OnlyCue.xcodeproj \
            -scheme OnlyCue \
            -destination 'platform=macOS' \
            -only-testing:OnlyCueUITests \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
